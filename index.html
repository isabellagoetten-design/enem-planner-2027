<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planejador ENEM 2027</title>
<style>body{font-family:Arial,sans-serif;padding:2rem;color:#333}#status{max-width:38rem;margin:10vh auto;line-height:1.5}</style>
</head>
<body>
<div id="status">Carregando o Planejador ENEM 2027...</div>
<script>
(async()=>{
 try {
  const parts=["planner-data/part-01.txt","planner-data/part-02.txt","planner-data/part-03.txt","planner-data/part-04.txt","planner-data/part-05.txt","planner-data/part-06.txt","planner-data/part-07.txt","planner-data/part-08.txt","planner-data/part-09.txt","planner-data/part-10.txt","planner-data/part-11.txt","planner-data/part-12.txt","planner-data/part-13.txt","planner-data/part-14.txt","planner-data/part-15.txt","planner-data/part-16.txt"];
  const responses=await Promise.all(parts.map(async p=>{const r=await fetch(p);if(!r.ok)throw new Error('Falha ao carregar '+p);return r.text()}));
  const html=responses.join('');
  document.open();document.write(html);document.close();
 } catch(e) {
  document.getElementById('status').textContent='Não foi possível carregar o planejador. Atualize a página ou tente novamente. '+e.message;
 }
})();
</script>
</body>
</html>
